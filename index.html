<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Dragon Exhibition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=Poiret+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Didact Gothic', sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Poiret One', cursive;
            font-size: 3rem;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            letter-spacing: 6px;
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 215, 0, 0.7);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .dragon-wrapper {
            position: relative;
            z-index: 2;
        }

        .dragon-gif {
            max-width: 100%;
            height: auto;
            animation: float 4s ease-in-out infinite;
        }

        .dragon-title {
            font-family: 'Poiret One', cursive;
            font-size: 2rem;
            color: #FFD700;
            margin-top: 20px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .dragon-description {
            font-size: 1rem;
            color: rgba(255, 215, 0, 0.8);
            margin-top: 12px;
            line-height: 1.8;
            text-align: center;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            .dragon-title {
                font-size: 1.5rem;
            }

            .dragon-description {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Golden Dragon</h1>
            <p class="subtitle">Legendary Creature</p>
        </header>

        <div class="dragon-wrapper">
            <video id="heroVideo" src="cycle.mp4" autoplay loop muted playsinline class="dragon-gif" style="display:block; width:100%; max-width:700px;"></video>
            <h2 class="dragon-title">Golden Dragon</h2>
            <p class="dragon-description">
                A magnificent golden dragon, symbolizing power, wisdom, and good fortune in Chinese mythology.
            </p>
        </div>
    </div>

    <audio id="dragonSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/309/309.wav" type="audio/wav">
    </audio>

    <script>
        const audio = document.getElementById('dragonSound');
        let isPlaying = false;

        function playAllVideos() {
            document.querySelectorAll('video').forEach(function(video) {
                video.currentTime = 0;
                video.play().catch(function(e) {});
            });
        }

        document.addEventListener('click', function() {
            playAllVideos();
            
            if (!isPlaying) {
                isPlaying = true;
                audio.currentTime = 0;
                audio.play().catch(e => {});

                setTimeout(() => {
                    audio.currentTime = 0;
                    audio.play().catch(e => {});
                    setTimeout(() => {
                        isPlaying = false;
                    }, 3000);
                }, 2000);
            }
        });

        document.addEventListener('touchstart', function(e) {
            playAllVideos();
            
            if (!isPlaying) {
                isPlaying = true;
                audio.currentTime = 0;
                audio.play().catch(e => {});

                setTimeout(() => {
                    audio.currentTime = 0;
                    audio.play().catch(e => {});
                    setTimeout(() => {
                        isPlaying = false;
                    }, 3000);
                }, 2000);
            }
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', function() {
            playAllVideos();
        });

        window.addEventListener('load', function() {
            playAllVideos();
        });
    </script>
</body>
</html>
